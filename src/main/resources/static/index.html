<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFlow - Banking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- App Container -->
    <div id="app" class="min-h-screen flex flex-col justify-between">
        
        <!-- Navbar -->
        <header class="bg-indigo-600 text-white shadow-md hidden" id="navbar">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">FinFlow Dashboard</h1>
                <button onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded text-sm font-semibold transition">Logout</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
            
            <!-- AUTH SECTION (Login / Register) -->
            <div id="auth-section" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8 mt-10">
                <div class="flex justify-center mb-6 space-x-4 border-b pb-4">
                    <button id="tab-login" onclick="switchTab('login')" class="font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1">Login</button>
                    <button id="tab-register" onclick="switchTab('register')" class="text-gray-400 font-semibold pb-1">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="login-username" required class="mt-1 w-full px-3 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="login-password" required class="mt-1 w-full px-3 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-semibold transition">Sign In</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="reg-username" required class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="reg-email" required class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="reg-password" required class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-semibold transition">Register</button>
                </form>
                <p id="auth-error" class="text-red-500 text-sm mt-4 text-center"></p>
            </div>

            <!-- DASHBOARD SECTION -->
            <div id="dashboard-section" class="hidden space-y-8">
                
                <!-- Accounts Overview -->
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Your Accounts</h2>
                        <button onclick="createAccount()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-semibold transition">+ Open New Account</button>
                    </div>
                    <div id="accounts-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Transfer Funds -->
                <div class="bg-white p-6 rounded-xl shadow-md max-w-lg">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Transfer Funds</h2>
                    <form onsubmit="handleTransfer(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Source Account Number</label>
                            <input type="text" id="source-acc" required class="mt-1 w-full px-3 py-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Target Account Number</label>
                            <input type="text" id="target-acc" required class="mt-1 w-full px-3 py-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Amount ($)</label>
                            <input type="number" step="0.01" id="transfer-amount" required class="mt-1 w-full px-3 py-2 border rounded-md">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-semibold transition">Send Money</button>
                    </form>
                    <p id="transfer-msg" class="text-sm mt-2 text-center font-medium"></p>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t py-4 text-center text-sm text-gray-500">
            &copy; 2026 FinFlow Application
        </footer>
    </div>

    <!-- Frontend JavaScript Logic -->
    <script>
        const API_BASE = '';

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1";
                tabRegister.className = "text-gray-400 font-semibold pb-1";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1";
                tabLogin.className = "text-gray-400 font-semibold pb-1";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) throw new Error("Invalid credentials");
                const data = await res.json();
                
                // Assuming backend returns a token property (adjust key if token is structured differently)
                localStorage.setItem('token', data.token || data.accessToken || data);
                loadDashboard();
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                if (!res.ok) throw new Error("Registration failed");
                alert("Registration successful! Please login.");
                switchTab('login');
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        }

        function loadDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            fetchAccounts();
        }

        async function fetchAccounts() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/accounts`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("Failed to fetch accounts");
                const accounts = await res.json();
                
                const list = document.getElementById('accounts-list');
                list.innerHTML = '';
                accounts.forEach(acc => {
                    list.innerHTML += `
                        <div class="border p-4 rounded-lg bg-gray-50 shadow-sm">
                            <p class="text-xs text-gray-500 uppercase font-semibold">Account Number</p>
                            <p class="text-md font-bold text-indigo-700">${acc.accountNumber}</p>
                            <p class="text-xs text-gray-500 uppercase font-semibold mt-2">Balance</p>
                            <p class="text-xl font-ext500 text-gray-900">$${acc.balance}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function createAccount() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/accounts`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("Could not create account");
                fetchAccounts();
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleTransfer(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const sourceAccountNumber = document.getElementById('source-acc').value;
            const targetAccountNumber = document.getElementById('target-acc').value;
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const msgEl = document.getElementById('transfer-msg');

            try {
                const res = await fetch(`${API_BASE}/api/transactions/transfer`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ sourceAccountNumber, targetAccountNumber, amount })
                });
                if (!res.ok) throw new Error("Transfer failed. Check account numbers and balance.");
                msgEl.className = "text-green-600 text-sm mt-2 text-center font-medium";
                msgEl.innerText = "Transfer completed successfully!";
                fetchAccounts();
            } catch (err) {
                msgEl.className = "text-red-500 text-sm mt-2 text-center font-medium";
                msgEl.innerText = err.message;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('navbar').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
